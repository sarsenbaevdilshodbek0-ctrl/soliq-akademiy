<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Soliq Akademiya</title><style>*{box-sizing:border-box}body{margin:0;font:16px/1.6 Arial;background:#f3f7fd;color:#143052}header{background:white;padding:16px 5%;display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;box-shadow:0 1px 9px #1233}nav{display:flex;gap:17px;flex-wrap:wrap}nav a{cursor:pointer;color:#164178;font-weight:bold}.hero{padding:75px 6%;color:white;background:linear-gradient(90deg,#08254e 20%,#123e7abf),url('/soliq_fon.png') center/cover}.hero h1{font-size:clamp(38px,6vw,70px);margin:0}.hero p{max-width:580px;font-size:20px}.wrap{max-width:1140px;margin:auto;padding:30px 20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}.card{background:white;border-radius:14px;overflow:hidden;box-shadow:0 3px 15px #153b6512;padding:22px;margin:10px 0}.cover{background:linear-gradient(130deg,#1051ac,#64adf3);height:120px;display:grid;place-items:center;font-size:48px;margin:-22px -22px 16px}.btn{background:#1161d5;color:white;padding:11px 18px;border:0;border-radius:8px;cursor:pointer;font-weight:bold}.field{width:100%;padding:12px;border:1px solid #bfcfe3;border-radius:8px;margin:6px 0 12px;font:inherit}label{font-weight:bold;display:block;margin-top:8px}.muted{color:#62748e}.price{font-size:34px;color:#1053ba;font-weight:bold}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.item{padding:12px;border-bottom:1px solid #e2eaf4;display:flex;justify-content:space-between;gap:15px;align-items:center}.content{white-space:pre-wrap}.notice{padding:14px;background:#e7f0ff;border-radius:9px;margin:15px 0}.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}footer{padding:25px;background:#08254e;color:white;text-align:center;margin-top:30px}@media(max-width:750px){.grid,.two{grid-template-columns:1fr}.hero{padding:45px 22px}nav{gap:10px}}</style></head><body><header><strong style="font-size:23px">🎓 Soliq Akademiya</strong><nav><a onclick="go('home')">Bosh sahifa</a><a onclick="go('courses')">Darslar</a><a onclick="go('tests')">Testlar</a><a onclick="go('pricing')">Obuna</a><a onclick="go('account')">Kabinet</a><a onclick="go('admin')">🔒 Admin</a></nav></header><div id="app"></div><footer>© 2026 Soliq Akademiya • Mustaqil ta’lim loyihasi</footer><script>
let user=null,premium=false,lessons=[],adm=null;const app=document.getElementById('app'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(p,m='GET',d){const r=await fetch('/api'+p,{method:m,headers:{'Content-Type':'application/json'},body:d?JSON.stringify(d):undefined});const j=await r.json();if(!r.ok)throw Error(j.error);return j}async function refresh(){const a=await api('/me');user=a.user;premium=a.premium;lessons=(await api('/lessons')).lessons}function view(title,body){app.innerHTML='<main class="wrap"><h1>'+title+'</h1>'+body+'</main>'}function home(){app.innerHTML='<section class="hero"><h1>Soliq Akademiya</h1><h2>Soliqni noldan o‘rgan!</h2><p>15 ta mavzu, amaliy testlar va sodda tushuntirishlar. Birinchi dars bepul!</p><button class="btn" onclick="go(\'courses\')">Bepul darsni boshlash →</button></section><main class="wrap"><h2>Nima uchun biz?</h2><div class="grid"><div class="card">📘 <h3>Sodda darslar</h3>Har bir mavzu tushunarli tilda.</div><div class="card">📝 <h3>Testlar</h3>Bilimlaringizni sinab ko‘ring.</div><div class="card">💎 <h3>Qulay obuna</h3>30 kun yoki 1 yil.</div></div></main>'}function courses(){view('📚 Darslar','<p>1-dars bepul, qolgan 14 tasi obuna bilan ochiladi.</p><div class="grid">'+lessons.map((l,i)=>'<div class="card"><div class="cover">'+(l.image?'<img src="'+esc(l.image)+'" style="height:100%;width:100%;object-fit:cover">':['📘','⚖️','🧮','📊','🏛️'][i%5])+'</div><small>'+(l.free?'🟢 BEPUL':l.locked?'🔒 PREMIUM':'🔓 OCHIQ')+'</small><h3>'+esc(l.title)+'</h3><p class="muted">'+esc(l.description)+'</p><button class="btn" onclick="lesson('+l.id+')">'+(l.locked?'Obuna bilan ochish':'Darsni ko‘rish')+'</button></div>').join('')+'</div>')}async function lesson(id){try{const {lesson:l}=await api('/lessons/'+id);view(esc(l.title),'<div class="card"><p>'+esc(l.description)+'</p><div class="content">'+esc(l.content)+'</div>'+(l.video?'<p><a href="'+esc(l.video)+'" target="_blank" rel="noopener">▶ Videodars</a></p>':'')+'</div>')}catch{go('pricing')}}function copyCard(){const number='5614688709701154';if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(number).then(()=>alert('Karta raqami nusxalandi. To‘lov ilovasida karta orqali o‘tkazmani tanlang.')).catch(()=>prompt('Karta raqamini nusxalang:',number))}else prompt('Karta raqamini nusxalang:',number)}
function payment(plan,amount,provider){if(!user){alert('Avval ro‘yxatdan o‘ting yoki akkauntingizga kiring.');go('account');return}copyCard();const url=provider==='click'?'https://click.uz/':'https://payme.uz/';window.open(url,'_blank','noopener,noreferrer')}
function pricing(){view('💎 Obuna tariflari','<div class="two">'+[[30,'30 kun','10 000'],[365,'1 yil (365 kun)','59 000']].map(x=>'<div class="card"><h2>'+x[1]+'</h2><div class="price">'+x[2]+' so‘m</div><p>Premium darslar va testlar</p><div class="row"><button class="btn" onclick="payment('+x[0]+','+x[2].replace(/ /g,'')+',\'click\')">Click orqali to‘lash</button><button class="btn" onclick="payment('+x[0]+','+x[2].replace(/ /g,'')+',\'payme\')">Payme orqali to‘lash</button></div></div>').join('')+'</div><div class="card"><h3>💳 To‘lov kartasi</h3><p style="font-size:23px;font-weight:bold;letter-spacing:1px">5614 6887 0970 1154</p><button class="btn" onclick="copyCard()">📋 Karta raqamini nusxalash</button><p>Click yoki Payme ilovasida <b>kartaga pul o‘tkazish</b> bo‘limini tanlab, shu raqamga tanlagan tarif summasini yuboring.</p></div><div class="notice"><b>Diqqat:</b> Click/Payme tugmalari ilova saytini ochadi, avtomatik to‘lov shaklini emas. Pul o‘tkazilganini administrator tekshiradi va obunani qo‘lda faollashtiradi. To‘lov chekini saqlang. Karta egasi va raqamini ilovada tekshirib tasdiqlang. To‘lov muvaffaqiyatli bo‘lmasdan premium ochilmaydi.</div>')}
function account(){if(!user){view('👤 Kirish / ro‘yxatdan o‘tish','<div class="two"><form class="card" onsubmit="auth(event,\'register\')"><h2>Ro‘yxatdan o‘tish</h2><label>Ism</label><input class="field" name="name" required><label>Email</label><input class="field" type="email" name="email" required><label>Parol</label><input class="field" type="password" name="password" minlength="8" required><button class="btn">Ro‘yxatdan o‘tish</button></form><form class="card" onsubmit="auth(event,\'login\')"><h2>Kirish</h2><label>Email</label><input class="field" type="email" name="email" required><label>Parol</label><input class="field" type="password" name="password" required><button class="btn">Kirish</button></form></div>');return}view('👤 Shaxsiy kabinet','<div class="card"><h2>'+esc(user.name)+'</h2><p>'+esc(user.email)+'</p><p>Holat: '+(user.admin?'Administrator — obunasiz to‘liq kirish':premium?'Obuna faol':'Obuna faol emas')+'</p><button class="btn" onclick="logout()">Chiqish</button></div>')}async function auth(e,type){e.preventDefault();try{await api('/'+type,'POST',Object.fromEntries(new FormData(e.target)));go('account')}catch(x){alert(x.message)}}async function logout(){await api('/logout','POST');go('home')}async function tests(){if(!premium){view('📝 Testlar','<div class="card">Testlar obuna bilan ochiladi. <button class="btn" onclick="go(\'pricing\')">Tariflar</button></div>');return}const {tests:t}=await api('/tests');if(!t.length){view('📝 Testlar','<div class="card">Hozircha testlar kiritilmagan.</div>');return}view('📝 Testlar','<form class="card" onsubmit="grade(event)">'+t.map((x,i)=>'<h3>'+(i+1)+'. '+esc(x.question)+'</h3>'+x.answers.map((a,j)=>'<label style="font-weight:normal"><input type="radio" name="'+x.id+'" value="'+j+'"> '+esc(a)+'</label>').join('')).join('')+'<button class="btn" style="margin-top:18px">Natijani ko‘rish</button></form>')}async function grade(e){e.preventDefault();const r=await api('/tests/grade','POST',{answers:Object.fromEntries(new FormData(e.target))});view('Natija','<div class="card">'+r.correct+' / '+r.total+' to‘g‘ri javob</div>')}async function adminLogin(e){e.preventDefault();try{await api('/login','POST',{email:'admin@soliq-akademiya.uz',password:new FormData(e.target).get('password')});go('admin')}catch(x){alert(x.message)}}async function admin(){if(!user?.admin){view('🔒 Administrator','<form class="card" onsubmit="adminLogin(event)"><h2>Admin panelga kirish</h2><p class="notice">Administrator uchun obuna talab qilinmaydi. Faqat admin parolini kiriting.</p><label>Admin paroli</label><input class="field" type="password" name="password" required autocomplete="current-password"><button class="btn">Admin sifatida kirish</button></form>');return}adm=await api('/admin');view('⚙️ Boshqaruv paneli','<div class="row"><button class="btn" onclick="tab(\'lessons\')">Darslar</button><button class="btn" onclick="tab(\'tests\')">Testlar</button><button class="btn" onclick="tab(\'users\')">Obunalar</button></div><div id="area"></div>');tab('lessons')}function tab(p){const a=document.getElementById('area');if(p==='lessons'){a.innerHTML='<div class="card"><h2>Darsni tahrirlash</h2><select class="field" id="lid" onchange="fill()">'+adm.lessons.map(l=>'<option value="'+l.id+'">'+l.id+'. '+esc(l.title)+'</option>').join('')+'</select><form onsubmit="saveLesson(event)"><label>Nomi</label><input id="title" class="field"><label>Tavsif</label><input id="desc" class="field"><label>Dars matni</label><textarea id="body" rows="8" class="field"></textarea><label>Rasm havolasi</label><input id="image" class="field"><label>Video havolasi</label><input id="video" class="field"><button class="btn">Saqlash</button></form></div>';fill()}else if(p==='tests'){a.innerHTML='<div class="card"><h2>Test qo‘shish</h2><form onsubmit="addTest(event)"><label>Savol</label><input id="q" class="field" required>'+[0,1,2,3].map(i=>'<label>'+['A','B','C','D'][i]+'</label><input class="field" id="a'+i+'" required>').join('')+'<label>To‘g‘ri javob</label><select class="field" id="correct"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select><button class="btn">Qo‘shish</button></form></div><div class="card">'+adm.tests.map(t=>'<div class="item">'+esc(t.question)+'<button class="btn" onclick="delTest('+t.id+')">O‘chirish</button></div>').join('')+'</div>'}else{a.innerHTML='<div class="card"><h2>Talabalar obunasi</h2><p>To‘lovni tekshirgandan keyin faollashtiring.</p>'+adm.users.filter(u=>!u.admin).map(u=>'<div class="item"><span>'+esc(u.name)+'<br>'+esc(u.email)+'<br><small>'+(u.expires>Date.now()?new Date(u.expires).toLocaleDateString('uz-UZ'):'Obuna yo‘q')+'</small></span><div class="row"><button class="btn" onclick="grant(\''+u.id+'\',30)">+30 kun</button><button class="btn" onclick="grant(\''+u.id+'\',365)">+1 yil</button><button class="btn" onclick="grant(\''+u.id+'\',0)">Bekor</button></div></div>').join('')+'</div>'}}function fill(){const l=adm.lessons.find(x=>x.id==document.getElementById('lid').value);for(const [a,b] of [['title','title'],['description','desc'],['content','body'],['image','image'],['video','video']])document.getElementById(b).value=l[a]||''}async function saveLesson(e){e.preventDefault();try{await api('/admin/lessons/'+document.getElementById('lid').value,'PUT',{title:document.getElementById('title').value,description:document.getElementById('desc').value,content:document.getElementById('body').value,image:document.getElementById('image').value,video:document.getElementById('video').value});alert('Saqlandi');go('admin')}catch(e){alert(e.message)}}async function addTest(e){e.preventDefault();try{await api('/admin/tests','POST',{question:document.getElementById('q').value,answers:[0,1,2,3].map(i=>document.getElementById('a'+i).value),correct:Number(document.getElementById('correct').value)});go('admin')}catch(e){alert(e.message)}}async function delTest(id){if(!confirm('O‘chirasizmi?'))return;await api('/admin/tests/'+id,'DELETE');go('admin')}async function grant(userId,days){if(!confirm('Obunani yangilaysizmi?'))return;await api('/admin/subscribe','POST',{userId,days});go('admin')}async function go(p){try{await refresh();await ({home,courses,pricing,account,tests,admin}[p]||home)()}catch(e){app.innerHTML='<main class="wrap"><div class="card">Server ishga tushmagan yoki aloqa uzilgan.</div></main>'}}
let currentTopic=null,currentSlide=0;
async function lesson(id){try{const [{lesson:l},{topic:t}]=await Promise.all([api('/lessons/'+id),api('/curriculum/'+id)]);currentTopic=t;currentSlide=0;view('📖 '+esc(l.title),'<div class="card"><p>'+esc(l.description)+'</p><div class="row"><button class="btn" onclick="showSlides()">🎞️ Slaydlardı kóriw</button><button class="btn" onclick="startQuiz()">📝 50 test</button></div><h2>Dárislik</h2><div class="content">'+esc(l.content)+'</div><hr><button class="btn" onclick="showSlides()">Slaydqa ótiw →</button></div>')}catch(e){alert(e.message);go('pricing')}}
function showSlides(){if(!currentTopic)return;const t=currentTopic,s=t.slides[currentSlide];view('🎞️ '+esc(t.title),'<div class="slide" style="background:linear-gradient(125deg,#071a39,#145bb6 '+(currentSlide%2?'65':'90')+'%,#0dbea8);color:white;min-height:390px;padding:clamp(24px,5vw,65px);border-radius:22px;box-shadow:0 16px 40px #1236"><p>📚 SOLIQ AKADEMIYA • '+(currentSlide+1)+' / '+t.slides.length+'</p><h1 style="font-size:clamp(24px,3.3vw,40px);color:#fff">'+esc(s.title)+'</h1><p style="font-size:clamp(16px,2vw,23px);line-height:1.7">'+esc(s.text)+'</p></div><div class="row" style="justify-content:space-between;margin:18px 0"><button class="btn" onclick="currentSlide=Math.max(0,currentSlide-1);showSlides()">← Aldıńǵı</button><strong>'+ (currentSlide+1)+' / '+t.slides.length+'</strong><button class="btn" onclick="currentSlide=Math.min(currentTopic.slides.length-1,currentSlide+1);showSlides()">Keyingi →</button><button class="btn" onclick="startQuiz()">50 test →</button></div>')}
function startQuiz(){if(!currentTopic)return;const t=currentTopic;view('📝 '+esc(t.title)+' — 50 test','<p>Hár bir sorawǵa bir juwap belgileń. Nátiyje hám statistika test sońında shıǵadı.</p><form class="card" onsubmit="gradeTopic(event)">'+t.quiz.map((q,i)=>'<div class="qblock" style="border-bottom:1px solid #ddd;padding:14px 0"><h3>'+(i+1)+'. '+esc(q.question)+'</h3>'+q.answers.map((a,j)=>'<label style="font-weight:normal;display:block;padding:5px"><input type="radio" name="'+q.id+'" value="'+j+'"> '+String.fromCharCode(65+j)+') '+esc(a)+'</label>').join('')+'</div>').join('')+'<button class="btn" style="margin-top:22px">📊 Nátiyjeni kóriw</button></form>')}
async function gradeTopic(e){e.preventDefault();const r=await api('/curriculum/'+currentTopic.id+'/grade','POST',{answers:Object.fromEntries(new FormData(e.target))});let history=JSON.parse(localStorage.getItem('soliqResults')||'[]');history.push({id:currentTopic.id,title:currentTopic.title,percent:r.percent,date:new Date().toLocaleString()});localStorage.setItem('soliqResults',JSON.stringify(history.slice(-100)));const wrong=r.details.filter(x=>x.chosen!==x.correct);view('📊 Test nátiyjesi','<div class="grid"><div class="card"><h2>'+r.correct+' / '+r.total+'</h2>Durıs juwap</div><div class="card"><h2>'+r.percent+'%</h2>Ózlestiriw dárejesi</div><div class="card"><h2>'+(r.total-r.correct)+'</h2>Qáte yamasa juwapsız</div></div><div class="card"><h2>Statistika</h2><div style="height:22px;background:#e4eaf4;border-radius:20px;overflow:hidden"><div style="width:'+r.percent+'%;background:#0ba784;height:100%"></div></div><p>Bul mavzu boyınsha aldınǵı nátiyjeler: '+history.filter(x=>x.id===currentTopic.id).map(x=>x.percent+'%').join(' • ')+'</p><button class="btn" onclick="startQuiz()">Qayta tapsırıw</button> <button class="btn" onclick="showSlides()">Slaydlardı kóriw</button></div><div class="card"><h2>Qátelerdi talqılaw ('+wrong.length+')</h2>'+wrong.map(x=>'<details style="padding:12px;border-bottom:1px solid #ddd"><summary>'+esc(x.question)+'</summary><p>Sizdiń juwabıńız: '+(x.chosen===null?'Belgilenbegen':esc(x.answers[x.chosen]||''))+'</p><p><b>Durısı:</b> '+esc(x.answers[x.correct])+'</p><p>'+esc(x.explanation)+'</p></details>').join('')+'</div>')}
const originalAccount=account;account=function(){originalAccount();if(user){const hist=JSON.parse(localStorage.getItem('soliqResults')||'[]');document.querySelector('main.wrap').insertAdjacentHTML('beforeend','<div class="card"><h2>📈 Test statistikam</h2>'+(hist.length?hist.map(x=>'<p>'+esc(x.title)+': <b>'+x.percent+'%</b> — '+esc(x.date)+'</p>').join(''):'Áli test tapsırılmaǵan')+'</div>')}};

go('home');
</script></body></html>
